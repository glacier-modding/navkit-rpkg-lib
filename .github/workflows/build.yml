name: Rust Build

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  validate_build:
    name: Validate Build
    runs-on: windows-latest
    strategy:
      matrix:
        config: [ debug, release ]
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ${{ matrix.config }}
        shell: pwsh
        run: |
          if ("${{ matrix.config }}" -eq "release") {
            cargo install cbindgen
            cbindgen --config cbindgen.toml --crate navkit-rpkg-lib --output navkit-rpkg-lib.h
            cargo build --release
            New-Item -ItemType Directory -Force -Path build/x64-release
            Copy-Item target/release/navkit_rpkg_lib.dll build/x64-release/
            Copy-Item target/release/navkit_rpkg_lib.dll.lib build/x64-release/
            Copy-Item navkit-rpkg-lib.h build/x64-release/
          } else {
            cargo build
          }

      - name: Upload Release Build Artifact
        if: matrix.config == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: navkit-rpkg-lib
          path: build/x64-release/

  validate_linux_build:
    name: Validate Linux ${{ matrix.arch }} (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64
            config: debug
          - arch: x86_64
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64
            config: release
          - arch: aarch64
            platform: linux/arm64
            image: quay.io/pypa/manylinux2014_aarch64
            config: debug
          - arch: aarch64
            platform: linux/arm64
            image: quay.io/pypa/manylinux2014_aarch64
            config: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux ${{ matrix.config }}
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          MANYLINUX_IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -e BUILD_CONFIG="$BUILD_CONFIG" \
            -v "$GITHUB_WORKSPACE:/io" -w /io \
            "$MANYLINUX_IMAGE" /bin/bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
              source "$HOME/.cargo/env"
              rustup toolchain install nightly --profile minimal
              if [ "$BUILD_CONFIG" = "release" ]; then
                cargo build --locked --release
                mkdir -p build
                cp target/release/libnavkit_rpkg_lib.so build/libnavkit_rpkg_lib.so
              else
                cargo build --locked
                mkdir -p build
                cp target/debug/libnavkit_rpkg_lib.so build/libnavkit_rpkg_lib.so
              fi
            '

      - name: Upload Linux ${{ matrix.config }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: navkit-rpkg-lib-linux-${{ matrix.arch }}-${{ matrix.config }}
          path: build/libnavkit_rpkg_lib.so
          if-no-files-found: error
